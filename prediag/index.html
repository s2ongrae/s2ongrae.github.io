<script>
// <PREDIAG_CORE> 화면과 무관한 계산 함수 (tests/prediag.test.js 가 이 구간을 뽑아 검증해요)
function dateStr(d){
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;
}
function calcCutoff(months, now){
  const d=new Date(now||Date.now());
  d.setMonth(d.getMonth()-months);
  return dateStr(d);
}
function calcYearCutoff(years, now){
  const d=new Date(now||Date.now());
  d.setFullYear(d.getFullYear()-years);
  return dateStr(d);
}
// 주민번호 앞 6자리 + 뒤 첫 자리 → 생년월일·성별 (뒤 첫 자리: 1·2·5·6 은 1900년대, 3·4·7·8 은 2000년대, 9·0 은 1800년대)
function parseBirth(front, back){
  if(!/^\d{6}$/.test(front||'') || !/^\d/.test(back||'')) return null;
  const g=+back[0], yy=+front.slice(0,2), mm=+front.slice(2,4), dd=+front.slice(4,6);
  const century = [1,2,5,6].includes(g) ? 1900 : [3,4,7,8].includes(g) ? 2000 : 1800;
  const birth=new Date(century+yy, mm-1, dd);
  if(birth.getFullYear()!==century+yy || birth.getMonth()!==mm-1 || birth.getDate()!==dd) return null;   // 2월 30일 같은 날짜는 거절
  return {birth, gender: g%2===1 ? '남성' : '여성'};
}
// 보험나이: 만 나이 + 직전 생일에서 6개월 이상 지났으면 1살 더함 (표준약관의 6개월 반올림)
function insAgeOf(birth, now){
  now = now ? new Date(now) : new Date();
  if(!(birth instanceof Date) || isNaN(birth) || birth > now) return null;
  let age = now.getFullYear()-birth.getFullYear();
  let last = new Date(now.getFullYear(), birth.getMonth(), birth.getDate());
  if(now < last){ age--; last = new Date(now.getFullYear()-1, birth.getMonth(), birth.getDate()); }
  const half = new Date(last.getFullYear(), last.getMonth()+6, last.getDate());
  return now >= half ? age+1 : age;
}
function insAgeFromRrn(front, back, now){
  const p=parseBirth(front, back);
  return p ? insAgeOf(p.birth, now) : null;
}
// </PREDIAG_CORE>
</script>

// 날짜·보험나이 계산은 위쪽 PREDIAG_CORE 구간에 있어요 (테스트가 그 구간을 직접 검증)

// 리스크 프로필

  if(m&&age<30)return{tag:"20대 남성",emoji:"💪",accent:BLUE,priority:malePriority,
    msg:"20대 남성은 통계적으로 상해 및 활동성 사고 확률이 매우 높습니다. 하지만 가장 저렴한 비용으로 평생 갈 3대 진단비(암·뇌·심)의 중심 기둥을 세울 수 있는 최고의 골든타임입니다.",
    noRenew:85,renew:15,plan:"월 만 원 미만 가성비 미니 암보험 플랜",layer:"20년납 100세만기 비갱신 3대진단비 + 실손 + 운전자"};
  if(m&&age<40)return{tag:"30대 남성",emoji:"🏢",accent:NAVY,priority:malePriority,
    msg:"30대 남성은 직장 스트레스와 생활습관 위험으로 중대질병 위험률이 가파르게 상승합니다. 은퇴 시점의 보험료 부담을 없애기 위해 20년납 100세만기 비갱신형 위주로 기본 뼈대를 리모델링해야 합니다.",
    noRenew:75,renew:25,plan:"설계사들만 아는 만 원 미만 순환계 질환 주요치료비 플랜",layer:"비갱신 뇌·심 + 20년납 3대진단비 + 갱신형 실손 혼합"};
  if(m&&age>=40)return{tag:"40대+ 남성",emoji:"⚠️",accent:"#C2410C",priority:malePriority,
    msg:"40대 이상 남성은 대한민국 3대 질병 발병 통계가 수직 상승하는 구간입니다. 완치 후 경제 활동 공백까지 고려해 진단비 한도를 극대화하고 치료비 중심으로 콤팩트하게 집중 보완해야 합니다.",
    noRenew:60,renew:40,plan:"고액 심혈관/뇌혈관 특정 치료비 집중 플랜",layer:"간편심사 검토 + 고액 진단비 우선 + 갱신형 실손 유지"};
  if(!m&&age<30)return{tag:"20대 여성",emoji:"🌸",accent:PINK,priority:femalePriority,
    msg:"20대 여성은 통계적으로 유방암, 갑상선암(유사암) 등 여성 특화 질환의 발병 시기가 남성보다 훨씬 빠르게 시작됩니다. 한도가 축소되기 전 소액암/유사암 진단비를 가장 저렴하게 선점해 두셔야 합니다.",
    noRenew:90,renew:10,plan:"월 몇 천 원대 여성 전용 미니 암케어 플랜",layer:"여성암 비갱신 + 소액암 선점 + 실손 + 태아보험 준비"};
  if(!m&&age<40)return{tag:"30대 여성",emoji:"👶",accent:"#7C3AED",priority:femalePriority,

    noRenew:80,renew:20,plan:"여성 특정 질병 수술비 및 1-5종 수술비 플랜",layer:"여성특화 비갱신 + 출산 전 완성 + 갱신형 실손 혼합"};
  return{tag:"40대+ 여성",emoji:"🌿",accent:GREEN,priority:femalePriority,
    msg:"40대 이상 여성은 갱년기 호르몬 변화와 더불어 노후 간병/치매 리스크 노출이 시작됩니다. 여성이 남성보다 노후 요양 기간이 길다는 통계를 반영하여 간병인 지원 체계를 조화롭게 설계해야 합니다.",
    noRenew:50,renew:50,plan:"노후 대비 간병인 사용 일당 및 치매 보장 플랜",layer:"간병·치매 집중 + 여성암 유지 + 연금형 병행 검토"};

// ─ Bar ─────────────────────────────────────────────────
function Bar({label,pct,color,delay=0}){
  const[w,setW]=useState(0);
  useEffect(()=>{const t=setTimeout(()=>setW(pct),delay+120);return()=>clearTimeout(t);},[pct,delay]);
  return(
    <div style={{marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
        <span style={{fontSize:13,color:"#334155",fontWeight:500}}>{label}</span>
        <span style={{fontSize:13,fontWeight:700,color}}>{pct}%</span>
      </div>
      <div style={{height:10,background:"#F1F5F9",borderRadius:999,overflow:"hidden"}}>
        <div style={{height:"100%",width:`${w}%`,background:color,borderRadius:999,transition:"width 1s cubic-bezier(.4,0,.2,1)"}}/>
      </div>
    </div>
  );
}

// ─ Priority badges ──────────────────────────────────────
function PriorityBadges({items,color}){
  return(
    <div style={{display:"flex",flexWrap:"wrap",alignItems:"center",gap:4,margin:"12px 0"}}>
      {items.map((label,i)=>(
        <React.Fragment key={i}>
          <span style={{padding:"5px 12px",borderRadius:8,background:color+"18",color,fontSize:12,fontWeight:700,border:`1px solid ${color}33`,whiteSpace:"nowrap"}}>{label}</span>
          {i<items.length-1&&<span style={{color:"#CBD5E1",fontSize:14,fontWeight:300}}>→</span>}
        </React.Fragment>
      ))}
    </div>
  );
}

// ─ Steps indicator ──────────────────────────────────────
function Steps({cur}){
  const labels=["기본정보","알릴의무","리스크 진단","완료"];
  return(
    <div style={{display:"flex",alignItems:"center",padding:"0 8px",marginBottom:24}}>
      {labels.map((l,i)=>{
        const n=i+1,done=n<cur,active=n===cur;
        return(
          <React.Fragment key={i}>
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,flexShrink:0}}>
              <div style={{width:28,height:28,borderRadius:14,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,
                background:done?GREEN:active?BLUE:"#CBD5E1",color:"#fff",
                boxShadow:active?`0 0 0 4px ${BLUEL}`:done?`0 0 0 4px ${GREENL}`:"none",transition:"all .3s"}}>
                {done?"✓":n}
              </div>
              <div style={{fontSize:10,color:active?BLUE:done?GREEN:MUTED,fontWeight:active||done?600:400,whiteSpace:"nowrap"}}>{l}</div>
            </div>
            {i<3&&<div style={{flex:1,height:2,background:done?GREEN:active?"#BFDBFE":"#E2E8F0",margin:"0 3px 14px",transition:"background .3s",minWidth:4}}/>}
          </React.Fragment>
        );
      })}
    </div>
  );
}

// ─ UI atoms ─────────────────────────────────────────────
function Card({children,style={}}){return <div style={{background:WHITE,borderRadius:16,border:`1px solid ${BORDER}`,padding:"18px 16px",marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,.05)",...style}}>{children}</div>;}
function Label({children}){return <label style={{display:"block",fontSize:12,fontWeight:700,color:MUTED,textTransform:"uppercase",letterSpacing:.5,marginBottom:8}}>{children}</label>;}
function Inp({...p}){return <input {...p} style={{width:"100%",padding:"12px 14px",border:`1.5px solid ${p.value?"#3B82F6":BORDER}`,borderRadius:12,fontSize:15,color:"#0F172A",background:WHITE,transition:"border .15s",outline:"none",...(p.style||{})}}/>;}
function Btn({children,onClick,disabled,style={}}){return <button onClick={onClick} disabled={disabled} style={{width:"100%",padding:"15px",borderRadius:14,background:disabled?"#94A3B8":`linear-gradient(135deg,${NAVY},${BLUE})`,color:WHITE,fontSize:15,fontWeight:700,border:"none",cursor:disabled?"not-allowed":"pointer",boxShadow:disabled?"none":`0 4px 16px rgba(37,99,235,.3)`,transition:"all .2s",...style}}>{children}</button>;}

// ══════════════════════════════════════════════════════
// STEP 1
// ══════════════════════════════════════════════════════
function Step1({form,setForm,onNext}){
  const{name,gender,rrnFront,rrnBack,occ,occCustom,occDetail,phone,carrier,sido,addrDetail}=form;
  const set=(k,v)=>setForm(p=>({...p,[k]:v}));
  const insAge=useMemo(()=>insAgeFromRrn(rrnFront,rrnBack),[rrnFront,rrnBack]);
  const parsed=rrnFront.length===6&&rrnBack.length===7?parseBirth(rrnFront,rrnBack):null;
  const checks = {
    이름: !!name,
    성별: !!gender,
    주민번호: !!parsed,
    직업: !!(occ && (occ!=="기타(직접입력)" || occCustom?.trim())),
    핸드폰: phone.replace(/[^0-9]/g,"").length>=10,
    통신사: !!carrier,
    거주지역: !!(sido && addrDetail?.trim().length>0),
  };
  const canNext = Object.values(checks).every(Boolean);

  return(
    <div className="fade-up">
      <div style={{marginBottom:20}}>
        <h2 style={{fontSize:20,fontWeight:800,color:"#0F172A",marginBottom:6}}>기본 정보 입력</h2>
        <p style={{fontSize:14,color:MUTED,lineHeight:1.6}}>보험 설계에 필요한 기본 정보를 입력해주세요.<br/>입력하신 정보는 상담·설계 목적으로 담당 설계사에게만 전달됩니다.</p>
      </div>

      <Card>
        <Label>이름</Label>
        <Inp placeholder="실명을 입력해주세요" value={name} onChange={e=>set("name",e.target.value)}/>
      </Card>

      <Card>
        <Label>성별</Label>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          {["남성","여성"].map(g=>(
            <div key={g} onClick={()=>set("gender",g)} style={{padding:"16px",borderRadius:14,border:`2px solid ${gender===g?BLUE:BORDER}`,background:gender===g?BLUEL:WHITE,cursor:"pointer",textAlign:"center",transition:"all .18s"}}>
              <div style={{fontSize:28,marginBottom:4}}>{g==="남성"?"👨":"👩"}</div>
              <div style={{fontSize:15,fontWeight:700,color:gender===g?BLUE:"#334155"}}>{g}</div>
            </div>
          ))}
        </div>
      </Card>

      <Card>
        <Label>주민등록번호</Label>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <Inp placeholder="앞 6자리" value={rrnFront} maxLength={6} inputMode="numeric"
            style={{flex:1,textAlign:"center",letterSpacing:4,fontSize:17}}
            onChange={e=>set("rrnFront",e.target.value.replace(/\D/g,""))}/>
          <span style={{fontSize:20,color:MUTED,flexShrink:0}}>—</span>
          <div style={{flex:1,position:"relative"}}>
            <input
              type="password"
              placeholder="뒤 7자리"
              value={rrnBack}
              maxLength={7}
              inputMode="numeric"
              onChange={e=>set("rrnBack",e.target.value.replace(/\D/g,""))}
              style={{width:"100%",padding:"12px 14px",border:`1.5px solid ${rrnBack?"#3B82F6":BORDER}`,borderRadius:12,fontSize:17,letterSpacing:4,color:"#0F172A",background:WHITE,outline:"none",textAlign:"center"}}/>
          </div>
        </div>
        <p style={{fontSize:12,color:"#94A3B8",marginTop:5}}>※ 주민등록증 기준으로 입력해 주세요 · 보험나이와 가입 심사 확인에 쓰여요</p>
        {rrnFront.length===6&&rrnBack.length===7&&!parsed&&(
          <p style={{fontSize:12,color:RED,marginTop:5,fontWeight:600}}>생년월일이 올바르지 않아요. 앞 6자리와 뒷자리 첫 숫자를 확인해 주세요</p>
        )}
        {parsed&&gender&&parsed.gender!==gender&&(
          <p style={{fontSize:12,color:AMBER,marginTop:5,fontWeight:600}}>주민번호로는 {parsed.gender}이에요. 성별 선택을 확인해 주세요</p>
        )}
        {insAge!==null&&rrnFront.length===6&&rrnBack.length===7&&(
          <div className="scale-in" style={{marginTop:10,padding:"12px 14px",background:`linear-gradient(135deg,${BLUEL},#DBEAFE)`,borderRadius:12,border:`1px solid #BFDBFE`}}>
            <div style={{fontSize:14,fontWeight:700,color:NAVY}}>
              🎯 {name||"고객"}님의 현재 보험 나이는 <span style={{fontSize:18,color:BLUE}}>{insAge}세</span>입니다
            </div>
            <div style={{fontSize:12,color:"#3B82F6",marginTop:3}}>만 나이에서 직전 생일 후 6개월이 지났으면 +1세 (상령일 기준)</div>
          </div>
        )}
      </Card>

      <Card>
        <Label>핸드폰 번호</Label>
        <input
          type="tel"
          placeholder="010-0000-0000"
          value={phone}
          maxLength={13}
          onChange={e=>{
            const d=e.target.value.replace(/[^0-9]/g,'').slice(0,11);
            const fmt=d.length<=3?d:d.length<=7?d.slice(0,3)+'-'+d.slice(3):d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);
            set("phone",fmt);
          }}
          style={{width:"100%",padding:"12px 14px",border:`1.5px solid ${phone?"#3B82F6":BORDER}`,borderRadius:12,fontSize:15,color:"#0F172A",background:WHITE,outline:"none",fontFamily:"inherit"}}
        />
        <div style={{marginTop:10}}>
          <div style={{fontSize:12,fontWeight:600,color:MUTED,marginBottom:8}}>통신사</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6}}>
            {[["SKT","🔴"],["KT","🟡"],["LG U+","🟣"],["SKT 알뜰폰","📱"],["KT 알뜰폰","📱"],["LG 알뜰폰","📱"]].map(([name2,ic])=>(
              <div key={name2} onClick={()=>set("carrier",name2)}
                style={{padding:"9px 4px",borderRadius:10,border:`2px solid ${carrier===name2?BLUE:BORDER}`,background:carrier===name2?BLUEL:WHITE,cursor:"pointer",textAlign:"center",transition:"all .15s"}}>
                <div style={{fontSize:14}}>{ic}</div>
                <div style={{fontSize:11,fontWeight:600,color:carrier===name2?BLUE:"#475569",marginTop:2,lineHeight:1.2}}>{name2}</div>
              </div>
            ))}
          </div>
        </div>
      </Card>

      <Card>
        <Label>직업</Label>
        <select value={occ} onChange={e=>set("occ",e.target.value)}

  const FORMSPREE_ID = "mrednkov";

  const buildDiscText = () => Q_DEFS.map(q=>{
    const ans = disc[q.k]===true?"예":disc[q.k]===false?"아니오":"모르겠음";
    const diseases = disc[q.k+"d"]?.join(", ")||"";
    const memo = disc[q.k+"memo"]||"";
    return `[${q.period} 이내] ${ans}${diseases?` / 부위: ${diseases}`:""}${memo?`\n상세: ${memo}`:""}`;
  }).join("\n");

  const handleSubmit=async()=>{
    setLoading(true); setError("");
    const payload={
      이름: form.name,
      성별: form.gender,
      주민번호: form.rrnFront&&form.rrnBack?`${form.rrnFront}-${form.rrnBack}`:"미입력",
      보험나이: insAge?`${insAge}세`:"미입력",
      핸드폰: form.phone||"미입력",
      통신사: form.carrier||"미입력",
      직업: form.occ==="기타(직접입력)"?(form.occCustom||"기타"):form.occ,
      업무상세: form.occDetail||"-",
      거주지역: [form.sido,form.addrDetail].filter(Boolean).join(" ")||"미입력",
      알릴의무: buildDiscText(),
      분석전략: risk?`${risk.tag} — ${risk.plan}`:"미분석",
      레이어링: risk?.layer||"-",
    };
    try {
      const fd = new FormData();
      Object.entries(payload).forEach(([k,v])=>fd.append(k, v||"-"));
      const res = await fetch(`https://formspree.io/f/${FORMSPREE_ID}`,{
        method:"POST",
        headers:{"Accept":"application/json"},
        body:fd,
      });
      if(res.ok) setSubmitted(true);
      else {
        const data = await res.json().catch(()=>({}));
        console.warn("Formspree 전송 실패", res.status, data);           // 원인 확인용 (고객 화면에는 쉬운 말로)
        setError("전송하지 못했어요. 잠시 뒤 다시 눌러 주시고, 계속 안 되면 설계사에게 카카오톡으로 알려 주세요.");
      }
    } catch(e) {
      setError("전송하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.");
    }
    finally { setLoading(false); }
  };

  if(submitted)return(
    <div className="scale-in" style={{textAlign:"center",padding:"20px 0"}}>
      <div style={{fontSize:64,marginBottom:16}}>🎉</div>
      <h2 style={{fontSize:22,fontWeight:800,color:"#0F172A",marginBottom:8}}>전송 완료!</h2>
      <p style={{fontSize:15,color:MUTED,lineHeight:1.7,marginBottom:20}}>사전 프로필 전송이 완료되었습니다.<br/>설계사가 배정되어 <strong style={{color:BLUE}}>카카오톡으로 정밀 분석<br/>제안서</strong>를 보내드릴 예정입니다.</p>
      <div style={{background:`linear-gradient(135deg,${NAVY},${BLUE})`,borderRadius:20,padding:"20px",color:WHITE,marginBottom:14,textAlign:"left"}}>
        <div style={{fontSize:13,opacity:.8,marginBottom:4}}>담당 설계사</div>
        <div style={{fontSize:17,fontWeight:700}}>김성래 보험설계사</div>
        <div style={{fontSize:13,opacity:.8,marginTop:2,marginBottom:12}}>보험 전문 컨설턴트</div>
        <div style={{padding:"12px",background:"rgba(255,255,255,.15)",borderRadius:12,fontSize:13}}>⏱ 영업일 기준 <strong>1일 이내</strong> 카카오톡으로 연락드립니다</div>
      </div>
      {risk&&<div style={{background:GREENL,borderRadius:14,padding:"14px",border:`1px solid #A7F3D0`,textAlign:"left"}}>
        <div style={{fontSize:13,color:"#065F46",lineHeight:1.6}}>✅ <strong>{form.name}님 예상 전략:</strong> {risk.layer}</div>
      </div>}
    </div>
  );

  return(
    <div className="fade-up">
      <div style={{marginBottom:20}}>
        <h2 style={{fontSize:20,fontWeight:800,color:"#0F172A",marginBottom:6}}>제출 전 최종 확인</h2>
        <p style={{fontSize:14,color:MUTED}}>아래 내용을 확인 후 전송해주세요</p>
      </div>

      <div style={{background:WHITE,borderRadius:16,border:`1px solid ${BORDER}`,padding:"18px 16px",marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,.05)"}}>
        <div style={{fontSize:14,fontWeight:700,color:"#0F172A",marginBottom:14,paddingBottom:12,borderBottom:`1px solid ${BORDER}`}}>📋 입력 정보 요약</div>
        {[
          ["이름",form.name],
          ["성별",form.gender],
          ["주민번호",form.rrnFront&&form.rrnBack?`${form.rrnFront} - ${form.rrnBack[0]}••••••`:"미입력"],
          ["보험 나이",insAge?`${insAge}세`:"미입력"],
          ["핸드폰",form.phone||"미입력"],
          ["통신사",form.carrier||"미입력"],
          ["직업",form.occ==="기타(직접입력)"?form.occCustom||"기타":form.occ],
          ["업무 상세",form.occDetail||"-"],
          ["거주지",[form.sido,form.addrDetail].filter(Boolean).join(" ")||"미입력"],
        ].map(([k,v])=>(
          <div key={k} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:`1px dashed ${BORDER}`}}>
            <span style={{fontSize:13,color:MUTED}}>{k}</span>
            <span style={{fontSize:13,fontWeight:600,color:"#0F172A"}}>{v}</span>
          </div>
        ))}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0"}}>
          <span style={{fontSize:13,color:MUTED}}>알릴의무</span>
          <span style={{fontSize:13,fontWeight:600,color:hasYes?RED:GREEN}}>{hasYes?"유병 이력 있음 ⚠️":"이상 없음 ✓"}</span>
        </div>
      </div>

      {risk&&(
        <div style={{background:BLUEL,border:`1px solid #BFDBFE`,borderRadius:16,padding:"16px",marginBottom:12}}>
          <div style={{fontSize:12,color:"#1E40AF",fontWeight:600,marginBottom:4}}>🎯 분석된 맞춤 전략</div>
          <div style={{fontSize:15,fontWeight:700,color:NAVY,marginBottom:4}}>{risk.tag}</div>
          <div style={{fontSize:13,color:"#1E40AF"}}>{risk.plan}</div>
        </div>
      )}

      <div style={{background:AMBERL,border:`1px solid #FDE68A`,borderRadius:14,padding:"14px",marginBottom:20}}>
        <div style={{fontSize:12,color:"#92400E",lineHeight:1.6}}>📌 <strong>개인정보 수집 안내:</strong> 입력하신 정보는 보험 상담 및 설계 목적으로만 사용되며, 설계사 외 제3자에게 제공되지 않습니다. 전송은 폼 전송 서비스(Formspree)를 거쳐 설계사 메일로 전달됩니다.</div>
      </div>

      <button onClick={handleSubmit} disabled={loading} style={{width:"100%",padding:"18px",borderRadius:16,background:loading?"#93C5FD":`linear-gradient(135deg,${NAVY} 0%,${BLUE} 100%)`,color:WHITE,fontSize:16,fontWeight:700,border:"none",cursor:loading?"not-allowed":"pointer",boxShadow:loading?"none":`0 4px 20px rgba(37,99,235,.4)`,transition:"all .2s",letterSpacing:.3}}>
        {loading?"전송 중... 잠시만 기다려주세요 ⏳":"📨 설계사에게 보내고 맞춤 제안서 받기"}
      </button>
      {error&&<div style={{marginTop:10,padding:"12px",background:"#FEF2F2",borderRadius:10,border:"1px solid #FECACA",fontSize:13,color:"#DC2626",textAlign:"center"}}>{error}</div>}
      <button onClick={onPrev} style={{width:"100%",padding:"13px",marginTop:10,borderRadius:14,border:`1.5px solid ${BORDER}`,background:WHITE,color:"#475569",fontSize:14,fontWeight:600}}>← 이전으로</button>
      <div style={{textAlign:"center",marginTop:14,fontSize:12,color:"#94A3B8"}}>🔒 전송 구간 암호화(HTTPS) · 스팸 없음 · 언제든 거절 가능</div>
    </div>
  );
}

// ══════════════════════════════════════════════════════
// ROOT
// ══════════════════════════════════════════════════════
function App(){
  const[step,setStep]=useState(1);
  const[form,setForm]=useState({name:"",gender:"",rrnFront:"",rrnBack:"",occ:"",occCustom:"",occDetail:"",phone:"",carrier:"",sido:"",addrDetail:""});
  const[disc,setDisc]=useState({q1:null,q1d:[],q1memo:"",q2:null,q2d:[],q2memo:"",q3:null,q3d:[],q3memo:""});

  return(
    <div style={{maxWidth:480,margin:"0 auto",minHeight:"100vh",background:BG}}>
      <div style={{background:`linear-gradient(135deg,${NAVY} 0%,#1D4ED8 100%)`,padding:"20px 20px 0",color:WHITE}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
          <div style={{width:42,height:42,borderRadius:21,background:"rgba(255,255,255,.18)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>🏦</div>
          <div>
            <div style={{fontSize:15,fontWeight:800,letterSpacing:-.3}}>김성래 설계사 · 1:1 사전진단</div>
            <div style={{fontSize:12,opacity:.75}}>프리미엄 맞춤 보험 분석 서비스</div>
          </div>
        </div>
        <Steps cur={step}/>
      </div>
      <div style={{padding:"20px 16px 48px"}}>
        {step===1&&<Step1 form={form} setForm={setForm} onNext={()=>setStep(2)}/>}
        {step===2&&<Step2 disc={disc} setDisc={setDisc} form={form} onNext={()=>setStep(3)} onPrev={()=>setStep(1)}/>}
        {step===3&&<Step3 form={form} disc={disc} onNext={()=>setStep(4)} onPrev={()=>setStep(2)}/>}
        {step===4&&<Step4 form={form} disc={disc} onPrev={()=>setStep(3)}/>}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
